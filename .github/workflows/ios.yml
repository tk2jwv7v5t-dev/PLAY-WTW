# يبني تطبيق الآيفون على ماك سحابي، ويرفعه على TestFlight.
# التطبيق يفتح الموقع من داخله، فتحديثات الموقع توصل للتطبيق على طول بدون بناء جديد.
# البناء يشتغل لحاله لما يتغيّر شي في مجلد app/، أو يدوياً من تبويب Actions.
#
# الأسرار المطلوبة (Settings ← Secrets and variables ← Actions):
#   APPLE_TEAM_ID   رقم الفريق من حساب المطوّرين (10 حروف وأرقام)
#   ASC_KEY_ID      Key ID لمفتاح App Store Connect API
#   ASC_ISSUER_ID   Issuer ID
#   ASC_KEY_P8      محتوى ملف ‎.p8‎ كامل
# اختياري (Variables): APP_BUNDLE_ID لو تبي معرّف غير com.playwtw.app
# بدون الأسرار: يبني نسخة بدون توقيع (للتأكد إن البناء سليم) وما يرفع شي.
name: iOS → TestFlight

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write  # عشان ننشر ملف الـ IPA في Releases

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.playwtw.app' }}
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    defaults:
      run:
        shell: bash  # يوقف لو أي أمر فشل حتى داخل | tail
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: تجهيز المشروع
        run: |
          npm ci
          npx cap sync ios
          xcodebuild -version

      - name: مفتاح App Store Connect
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/asc.p8"
          chmod 600 "$RUNNER_TEMP/keys/asc.p8"

      - name: بناء موقّع (Archive)
        if: env.HAS_SIGNING == 'true'
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/asc.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tail -n 60
          test -d "$RUNNER_TEMP/App.xcarchive"

      - name: رفع على TestFlight
        if: env.HAS_SIGNING == 'true'
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/asc.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
          echo "✅ انرفعت النسخة رقم $BUILD_NUMBER على TestFlight. تطلع في App Store Connect خلال 10–30 دقيقة." >> "$GITHUB_STEP_SUMMARY"

      - name: بناء بدون توقيع (ما فيه أسرار للحين)
        if: env.HAS_SIGNING != 'true'
        working-directory: app/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tail -n 60
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry PLAY-WTW-unsigned.ipa Payload)
          echo "ℹ️ البناء سليم. ما فيه أسرار توقيع للحين، فما انرفع على TestFlight." >> "$GITHUB_STEP_SUMMARY"

      # رابط ثابت للتحميل من الجوال (لـ TrollStore): نفس الإصدار يتحدّث مع كل بناء
      - name: نشر الـ IPA للتحميل المباشر
        if: env.HAS_SIGNING != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/ipa/PLAY-WTW-unsigned.ipa" "$RUNNER_TEMP/ipa/PLAY-WTW.ipa"
          NOTES="نسخة رقم $BUILD_NUMBER بدون توقيع، للتثبيت عن طريق TrollStore (iOS 15.0 لين 16.6.1، و16.7 RC، و17.0)."
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release upload ios-latest "$RUNNER_TEMP/ipa/PLAY-WTW.ipa" --clobber
            gh release edit ios-latest --notes "$NOTES"
          else
            gh release create ios-latest "$RUNNER_TEMP/ipa/PLAY-WTW.ipa" --title "PLAY WTW للآيفون" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          echo "📲 رابط التحميل: https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest/PLAY-WTW.ipa" >> "$GITHUB_STEP_SUMMARY"

      - name: حفظ النسخة بدون توقيع
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-WTW-unsigned-ipa
          path: ${{ runner.temp }}/ipa/PLAY-WTW-unsigned.ipa
          retention-days: 14

      - name: تنظيف المفتاح
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
